name: Build and Publish OCaml Dev Container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize publish runs because they share a temporary staging tag.
concurrency:
  group: publish
  cancel-in-progress: false

# Single source of truth for how many platform legs the build matrix produces.
# Keep it in sync with build.strategy.matrix: the merge job refuses to publish
# if it receives a different number of digests (for example after removing the
# arm64 leg on a private copy, which has no arm64 runners).
env:
  EXPECTED_PLATFORMS: "2"

jobs:
  # Build each platform on a matching native runner. Building linux/arm64 under
  # QEMU on an amd64 runner is extremely slow because OCaml is compiled from
  # source, so we build natively and run the two platforms in parallel.
  #
  # arm64 Linux runners (ubuntu-24.04-arm) are standard GitHub-hosted runners
  # for public repositories, where they are free and unlimited. A private copy
  # or fork may lack access to them; in that case either remove the arm64 entry
  # below or fall back to a single ubuntu-latest job using
  # docker/setup-qemu-action with both platforms in one build.
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # Native builds are independent; keep the surviving platform's result so
      # a single platform failure is still diagnosed in the same run.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            # Cache/artifact safe form of the platform (no slash).
            platform_pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Only used for labels here; the release tags are created by the
          # merge job so nothing is exposed before the scan gate passes.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Push by digest only; the per-platform manifests are combined into a
      # single multi-arch image by the `merge` job below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          # Registry cache is shared across workflow runs and git refs, so a
          # tag-triggered publish can reuse layers from earlier releases.
          # type=gha is deliberately not used: it is scoped to the git ref, and
          # tag refs never repeat, so it would only ever be written and never
          # read. Each platform has its own ref so the parallel jobs never
          # overwrite each other's cache.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.platform_pair }},mode=max

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not report a valid digest: '${digest}'" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Combine the per-platform manifests into one multi-arch image under a
  # temporary staging tag so the exact digest can be scanned before release.
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      # A17 is deferred: docker buildx imagetools should work with the default
      # docker driver, but this is the release path and the startup cost of
      # setup-buildx is not worth an unverified assumption. Remove only after
      # confirming it works without a builder on ubuntu-latest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags are only produced for a tag push, and `latest` additionally
      # requires that the tagged commit be contained in the default branch. A
      # push of a tag has no triggering branch, so {{is_default_branch}} cannot
      # be used for that decision.
      - name: Check whether the tag commit is on the default branch
        id: on-default
        uses: actions/github-script@v9.0.0
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const defaultBranch = context.payload.repository.default_branch;
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${defaultBranch}...${context.sha}`,
            });
            // `identical` means the tagged commit is the default branch head,
            // `behind` means it is an ancestor of that head. Both mean the
            // commit is contained in the default branch.
            const contained = data.status === "identical" || data.status === "behind";
            core.info(`compare ${defaultBranch}...${context.sha} => ${data.status} (on default branch: ${contained})`);
            core.setOutput("on_default_branch", contained ? "true" : "false");

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Versioning model:
          #   X.Y.Z   immutable, canonical for this release
          #   X.Y     moving, latest patch of that minor line
          #   X       moving, latest minor/patch of that major line
          #           (suppressed for 0.x, where every release is breaking)
          #   latest  moving, stable releases from the default branch only
          #   sha-*   immutable, traceability back to the commit
          # Pre-release tags (v1.5.0-rc.1) only get {{version}} and sha: the
          # moving major/minor tags and latest must never track a pre-release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && steps.on-default.outputs.on_default_branch == 'true' && !contains(github.ref_name, '-') }}

      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create multi-arch staging image
        id: merge
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          EXPECTED_PLATFORMS: ${{ env.EXPECTED_PLATFORMS }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(/tmp/digests/*)
          if [ "${#files[@]}" -ne "${EXPECTED_PLATFORMS}" ]; then
            echo "Expected ${EXPECTED_PLATFORMS} platform digests, found ${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi

          digests=()
          for file in "${files[@]}"; do
            hex="$(basename "${file}")"
            if ! [[ "${hex}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Digest artifact is not a hex digest: '${hex}'" >&2
              exit 1
            fi
            digests+=("${IMAGE}@sha256:${hex}")
          done

          # A manifest push is not always immediately readable by a second
          # runner, so retry the merge a few times.
          attempt=0
          until docker buildx imagetools create \
              --tag "${IMAGE}:staging" \
              --metadata-file /tmp/merge-metadata.json \
              "${digests[@]}"; do
            attempt=$((attempt + 1))
            if [ "${attempt}" -ge 3 ]; then
              echo "Failed to create the staging image after 3 attempts" >&2
              exit 1
            fi
            echo "Merge attempt ${attempt} failed, retrying in 10s" >&2
            sleep 10
          done

          # Read the merged digest out of the create result instead of a second
          # registry round trip and a template that only works for indexes.
          digest="$(jq -er '."containerimage.descriptor".digest' /tmp/merge-metadata.json)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Merged image has no valid digest: '${digest}'" >&2
            exit 1
          fi
          echo "Merged digest: ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Record merged manifest
        # Audit trail of exactly what was scanned. Cosmetic, so it must never
        # block a release that passed the gate.
        continue-on-error: true
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          {
            echo '### Merged manifest'
            echo
            echo '```json'
            docker buildx imagetools inspect \
              "ghcr.io/${{ github.repository }}@$DIGEST" \
              --format '{{json .Manifest}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Scan the merged image and fail the release if fixable CRITICAL/HIGH
  # vulnerabilities are found.
  #
  # Accepted limitation: only linux/amd64 is scanned. The amd64 image is treated
  # as representative of the release; see the security section of the README.
  security-scan:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: ./.github/actions/security-scan
        with:
          image-ref: "ghcr.io/${{ github.repository }}@${{ needs.merge.outputs.digest }}"
          platform: linux/amd64

  # Create the release tags only if the scan passed.
  promote:
    needs: [merge, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote scanned image to release tags
        env:
          TAGS: ${{ needs.merge.outputs.tags }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          # Read into an array rather than piping: a pipe would run the loop in
          # a subshell, so the counter used by the guard below would never
          # survive the loop.
          mapfile -t tags <<< "$TAGS"
          count=0
          for tag in "${tags[@]}"; do
            [ -n "$tag" ] || continue
            echo "Tagging $tag"
            docker buildx imagetools create --tag "$tag" \
              "ghcr.io/${{ github.repository }}@$DIGEST"
            count=$((count + 1))
          done
          if [ "${count}" -eq 0 ]; then
            echo "No release tags were produced; refusing to publish silently" >&2
            exit 1
          fi
          echo "Published ${count} tag(s)" >&2
