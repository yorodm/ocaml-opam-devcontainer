
name: Container Security Scan
description: Install Trivy, scan a container image, add the report to the job summary, and comment on pull requests.

inputs:
  image-ref:
    description: "Image reference to scan (local tag, registry reference, or digest)."
    required: true
  platform:
    description: >-
      Platform to scan, passed to Trivy as --platform. Leave empty to let Trivy
      use its default for the image source: required for locally loaded
      single-arch images, but explicit is preferred for multi-arch registry
      digests so the result does not depend on the runner architecture.
    required: false
    default: ""
  trivy-version:
    description: >-
      Trivy release to install, pinned to an exact version and verified against
      the release checksums. Upgrades are manual: change this value only when a
      newer release is actually needed (for example a scanner bug affecting the
      gate) and re-run CI to confirm the scan still behaves.
    required: false
    default: "v0.76.2"

runs:
  using: composite
  steps:
    - name: Install Trivy
      id: install-trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
      run: |
        set -euo pipefail

        version="${TRIVY_VERSION#v}"
        tag="v${version}"

        if [ "$(uname -s)" != "Linux" ]; then
          echo "Unsupported OS: $(uname -s)" >&2
          exit 1
        fi

        case "$(uname -m)" in
          x86_64) arch=64bit ;;
          aarch64|arm64) arch=ARM64 ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        base="https://github.com/aquasecurity/trivy/releases/download/${tag}"
        archive="trivy_${version}_Linux-${arch}.tar.gz"
        checksums="trivy_${version}_checksums.txt"
        workdir="$(mktemp -d)"
        trap 'rm -rf "${workdir}"' EXIT

        curl -fsSL -o "${workdir}/${archive}" "${base}/${archive}"
        curl -fsSL -o "${workdir}/${checksums}" "${base}/${checksums}"

        checksum_line="$(awk -v archive="${archive}" '$2 == archive { print }' "${workdir}/${checksums}")"
        if [ -z "${checksum_line}" ]; then
          echo "Checksum not found for ${archive}" >&2
          exit 1
        fi
        (cd "${workdir}" && printf '%s\n' "${checksum_line}" | sha256sum -c -)

        install -d "${RUNNER_TEMP}/trivy-bin"
        tar -xzf "${workdir}/${archive}" -C "${RUNNER_TEMP}/trivy-bin" trivy
        chmod +x "${RUNNER_TEMP}/trivy-bin/trivy"

        echo "trivy=${RUNNER_TEMP}/trivy-bin/trivy" >> "$GITHUB_OUTPUT"
        "${RUNNER_TEMP}/trivy-bin/trivy" --version

    - name: Get current date
      id: trivy-date
      shell: bash
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Cache Trivy database
      uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-cache
        key: trivy-db-${{ runner.os }}-${{ inputs.trivy-version }}-${{ steps.trivy-date.outputs.date }}
        restore-keys: |
          trivy-db-${{ runner.os }}-${{ inputs.trivy-version }}-

    - name: Scan image for vulnerabilities
      id: scan
      # Keep going so the report and PR comment are still published; the final
      # step fails the action if the scan found anything.
      continue-on-error: true
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        TRIVY_BIN: ${{ steps.install-trivy.outputs.trivy }}
        TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        TRIVY_PLATFORM: ${{ inputs.platform }}
      run: |
        platform_args=()
        if [ -n "${TRIVY_PLATFORM}" ]; then
          platform_args=(--platform "${TRIVY_PLATFORM}")
        fi
        "${TRIVY_BIN}" image \
          "${platform_args[@]}" \
          --format table \
          --output trivy-results.txt \
          --exit-code 1 \
          --ignore-unfixed \
          --severity CRITICAL,HIGH \
          --pkg-types os,library \
          --timeout 10m \
          "${IMAGE_REF}"

    # Keep the report visible in the job summary, including for pull requests
    # from forks where the token is read-only and cannot post a comment.
    - name: Add scan report to job summary
      if: ${{ !cancelled() }}
      continue-on-error: true
      shell: bash
      run: |
        if [ -f trivy-results.txt ]; then
          {
            echo '## Container vulnerability scan'
            echo
            echo '```'
            head -c 500000 trivy-results.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # Update a single sticky comment on the pull request with the results.
    # Only same-repository pull requests are commented on: GITHUB_TOKEN is
    # read-only for pull requests from forks.
    - name: Post scan results to pull request
      if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
      continue-on-error: true
      uses: actions/github-script@v9.0.0
      env:
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- trivy-scan-report -->';
          const reportPath = `${process.env.GITHUB_WORKSPACE}/trivy-results.txt`;

          let report = '';
          try {
            report = fs.readFileSync(reportPath, 'utf8').trim();
          } catch (error) {
            report = `No report was generated.\n${error.message}`;
          }

          const escapeHtml = (value) => value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

          // GitHub comments are limited to 65536 characters.
          let escapedReport = escapeHtml(report);
          const limit = 60000;
          const truncated = escapedReport.length > limit;
          if (truncated) {
            escapedReport = escapedReport.slice(0, limit);
          }

          const failed = process.env.SCAN_OUTCOME === 'failure';

          // Pass/fail comes only from the scan exit code (--exit-code 1).
          // Severity counts also appear inside vulnerability descriptions, so
          // inferring the outcome from the report text can lie.
          let summary;
          if (failed) {
            summary = '\u274c The vulnerability scan failed: fixable CRITICAL or HIGH findings were reported, or the scan could not complete. See the report below.';
          } else {
            summary = '\u2705 No fixable CRITICAL or HIGH severity vulnerabilities found.';
          }

          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issue_number = context.payload.pull_request.number;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          const body = [
            marker,
            '## Container vulnerability scan',
            '',
            summary,
            '',
            `[View the workflow run](${runUrl})`,
            '',
            '<details>',
            '<summary>Full Trivy report</summary>',
            '',
            '<pre>',
            escapedReport,
            '</pre>',
            ...(truncated ? ['', '_Report truncated to fit the comment size limit._'] : []),
            '</details>',
          ].join('\n');

          const comments = await github.paginate(
            github.rest.issues.listComments,
            { owner, repo, issue_number, per_page: 100 }
          );

          const existing = comments.find((comment) => comment.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

    - name: Fail if vulnerabilities were found
      if: ${{ steps.scan.outcome == 'failure' }}
      shell: bash
      run: exit 1
