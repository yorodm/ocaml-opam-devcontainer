
name: Test Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The reusable workflow builds the image once and scans it, so there is no
  # separate build job here (that would build the same image twice per PR).
  security-scan:
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      # Needed so the scan can post its results as a pull request comment.
      pull-requests: write
