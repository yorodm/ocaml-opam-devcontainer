
name: Container Security Scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build a single-platform image so it can be loaded locally and scanned.
      # The amd64 layers are representative of the arm64 image built from the
      # same Dockerfile.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ocaml-opam-devcontainer:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail when the image contains fixable CRITICAL or HIGH severity
      # vulnerabilities. Unfixed issues are ignored, since they cannot be
      # remediated and would otherwise block unrelated changes.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ocaml-opam-devcontainer:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          timeout: '10m'
